    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Helvetica Neue', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            overflow-x: hidden;

        }

        /* 注释掉加载动画的CSS
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00e6f6;
            border-radius: 50%;

        */

        /* 卡片悬停效果 */
        .scene-card {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .scene-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: all 0.6s ease;
        }

        .scene-card:hover::before {
            left: 100%;
        }

        .scene-card:hover img {
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 0.7;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        /* 波纹效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes ripple {
            to {
                transform: scale(2.5);
                opacity: 0;
            }
        }
        
        /* 服务器位置指示器 */
        .server-indicator {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(0, 230, 246, 0.1);
            border: 1px solid rgba(0, 230, 246, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #00e6f6;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        /* 九宫格布局 */
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 标题动画 */
        @keyframes title-glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(0, 230, 246, 0.5);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 230, 246, 0.8), 
                             0 0 30px rgba(173, 75, 255, 0.6);
            }
        }
        
        .glowing-title {
            animation: title-glow 3s infinite ease-in-out;
        }
        
        /* 注释掉spin动画，因为spinner已被移除
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        */
    </style>
</head>

    <script>
        // 波纹效果
        document.querySelectorAll('.scene-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // 初始化 - 修改后的代码，直接显示内容，不显示加载动画
        window.addEventListener('DOMContentLoaded', () => {
            // 显示服务器位置指示器（如果存在的话）
            const serverIndicator = document.querySelector('.server-indicator');
            if (serverIndicator) {
                serverIndicator.style.opacity = '1';
            }
        });

        // 禁止缩放
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
